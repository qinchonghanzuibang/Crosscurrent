name: Crosscurrent
options:
  bundleIdPrefix: com.chonghanqin
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
configs:
  Debug: debug
  Sandbox: debug
  Release: release
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: true
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 15.0
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: false
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: true
packages:
  CrosscurrentKit:
    path: Packages/CrosscurrentKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  Crosscurrent:
    type: application
    platform: macOS
    sources: Apps/Crosscurrent
    info:
      path: Config/Info/Crosscurrent-Info.plist
      properties:
        CFBundleDisplayName: Crosscurrent
        LSApplicationCategoryType: public.app-category.news
        NSHumanReadableCopyright: Copyright © 2026 Chonghan Qin
        CrosscurrentTeamIdentifier: $(DEVELOPMENT_TEAM)
        SUFeedURL: $(CROSSCURRENT_APPCAST_URL)
        SUPublicEDKey: $(CROSSCURRENT_SPARKLE_PUBLIC_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: Crosscurrent Deep Links
            CFBundleURLSchemes: [crosscurrent]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Crosscurrent.developerid.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chonghanqin.crosscurrent
        PRODUCT_NAME: Crosscurrent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        CROSSCURRENT_APPCAST_URL: ""
        CROSSCURRENT_SPARKLE_PUBLIC_KEY: ""
      configs:
        Sandbox:
          CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Crosscurrent.sandbox.entitlements
    postBuildScripts:
      - name: Embed SMAppService LaunchAgents
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Config/LaunchAgents/com.chonghanqin.crosscurrent.agent.plist
          - $(SRCROOT)/Config/LaunchAgents/com.chonghanqin.crosscurrent.browser.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.chonghanqin.crosscurrent.agent.plist
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.chonghanqin.crosscurrent.browser.plist
        script: |
          destination="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/LaunchAgents"
          mkdir -p "$destination"
          cp "$SRCROOT/Config/LaunchAgents/com.chonghanqin.crosscurrent.agent.plist" "$destination/com.chonghanqin.crosscurrent.agent.plist"
          cp "$SRCROOT/Config/LaunchAgents/com.chonghanqin.crosscurrent.browser.plist" "$destination/com.chonghanqin.crosscurrent.browser.plist"
    dependencies:
      - package: CrosscurrentKit
        product: CrosscurrentDomain
      - package: CrosscurrentKit
        product: CrosscurrentStorage
      - package: CrosscurrentKit
        product: CrosscurrentModels
      - package: CrosscurrentKit
        product: CrosscurrentDesignSystem
      - package: CrosscurrentKit
        product: CrosscurrentReader
      - package: CrosscurrentKit
        product: CrosscurrentRanking
      - package: CrosscurrentKit
        product: CrosscurrentConnectors
      - package: CrosscurrentKit
        product: CrosscurrentBrowser
      - package: CrosscurrentKit
        product: CrosscurrentIngestion
      - package: CrosscurrentKit
        product: CrosscurrentIntelligence
      - package: CrosscurrentKit
        product: CrosscurrentSearch
      - package: CrosscurrentKit
        product: CrosscurrentIPC
      - package: Sparkle
        product: Sparkle
      - target: CrosscurrentShare
        embed: true
      - target: CrosscurrentAgent
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - target: CrosscurrentBrowserWorker
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
  CrosscurrentAgent:
    type: application
    platform: macOS
    sources: Apps/CrosscurrentAgent
    info:
      path: Config/Info/CrosscurrentAgent-Info.plist
      properties:
        CFBundleDisplayName: Crosscurrent Agent
        LSUIElement: true
        CrosscurrentTeamIdentifier: $(DEVELOPMENT_TEAM)
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CrosscurrentAgent.developerid.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chonghanqin.crosscurrent.agent
        PRODUCT_NAME: CrosscurrentAgent
      configs:
        Sandbox:
          CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CrosscurrentAgent.sandbox.entitlements
    preBuildScripts:
      - name: Xcode Header-Only NumKong Shim
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/CNumKong.o
        script: |
          mkdir -p "$BUILT_PRODUCTS_DIR"
          if [[ ! -f "$BUILT_PRODUCTS_DIR/CNumKong.o" ]]; then
            xcrun clang -c "$SRCROOT/BuildSupport/CNumKongShim.c" -o "$BUILT_PRODUCTS_DIR/CNumKong.o"
          fi
    dependencies:
      - package: CrosscurrentKit
        product: CrosscurrentStorage
      - package: CrosscurrentKit
        product: CrosscurrentIngestion
      - package: CrosscurrentKit
        product: CrosscurrentIntelligence
      - package: CrosscurrentKit
        product: CrosscurrentSearch
      - package: CrosscurrentKit
        product: CrosscurrentRanking
      - package: CrosscurrentKit
        product: CrosscurrentIPC
      - package: CrosscurrentKit
        product: CrosscurrentBrowser
      - package: CrosscurrentKit
        product: CrosscurrentConnectors
  CrosscurrentBrowserWorker:
    type: application
    platform: macOS
    sources: Apps/CrosscurrentBrowserWorker
    info:
      path: Config/Info/CrosscurrentBrowserWorker-Info.plist
      properties:
        CFBundleDisplayName: Crosscurrent Browser
        LSUIElement: true
        CrosscurrentTeamIdentifier: $(DEVELOPMENT_TEAM)
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CrosscurrentBrowserWorker.developerid.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chonghanqin.crosscurrent.browser
        PRODUCT_NAME: CrosscurrentBrowserWorker
      configs:
        Sandbox:
          CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CrosscurrentBrowserWorker.sandbox.entitlements
    dependencies:
      - package: CrosscurrentKit
        product: CrosscurrentBrowser
      - package: CrosscurrentKit
        product: CrosscurrentIPC
      - package: CrosscurrentKit
        product: CrosscurrentConnectors
  CrosscurrentShare:
    type: app-extension
    platform: macOS
    sources: Apps/CrosscurrentShare
    info:
      path: Config/Info/CrosscurrentShare-Info.plist
      properties:
        CFBundleDisplayName: Add to Crosscurrent
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareExtensionHandler
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count > 0).@count > 0'
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CrosscurrentShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chonghanqin.crosscurrent.share
        PRODUCT_NAME: CrosscurrentShare
    dependencies:
      - package: CrosscurrentKit
        product: CrosscurrentDomain
  CrosscurrentUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/CrosscurrentUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Crosscurrent
schemes:
  Crosscurrent:
    build:
      targets:
        Crosscurrent: all
        CrosscurrentAgent: all
        CrosscurrentBrowserWorker: all
        CrosscurrentShare: all
        CrosscurrentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrosscurrentUITests
    archive:
      config: Release
  Crosscurrent-Sandbox:
    build:
      targets:
        Crosscurrent: all
        CrosscurrentAgent: all
        CrosscurrentBrowserWorker: all
        CrosscurrentShare: all
    run:
      config: Sandbox
